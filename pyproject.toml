[project]
name = "name-machine"
version = "0.1.0"
description = ""
authors = [
    {name = "awt",email = "abdoulayewtoure@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "dash (>=4.5.1,<5.0.0)",
    "plotly (>=7.1.0,<8.0.0)",
    "polars (>=2.1.0,<3.0.0)",
    "pandas (>=3.1.1,<4.0.0)",
    "pyarrow (>=26.0.1,<27.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest (>=9.2.0,<10.0.0)",
    "ruff (>=0.17.6,<0.18.0)"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --basetemp=.pytest_tmp"
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I"]
